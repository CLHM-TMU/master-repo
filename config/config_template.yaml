# This is the sample configuration file for the microbiome analysis workflow of Core Laboratory of Human Microbiome, TMU.
# Please modify the parameters according to your experimental design and analysis needs.
# Save the modified file as '{PROJECT_NAME}.yaml' in the same directory as the Snakefile.
##############################################
# Project Information
##############################################

# Use the same exact characters as the title of the yaml file.
# If there are duplicate STUDY_NAME in the workflow directory, the pipeline might overwrite previous results.
STUDY_NAME: 'template'

##############################################
# Environment & Sequencing Parameters
##############################################

# Currently only "conda" environment is supported.
ENVIRONMENT_TYPE: "conda"  # or "docker"

ANALYSIS_MODE: 'standard'   

# Standard protocol at the lab includes NGS of V3-V4 region of 16S rRNA gene and TGS of full-length 16S rRNA gene.
SEQUENCE_TYPE: 'TGS'       # 'NGS' or 'TGS'
REGION: 'full_length'      # 'region_V3V4' or 'full_length'

N_THREADS: 10

##############################################
# Reference Database
##############################################

#C Currently supported databases: 'Greengenes2'
REFERENCE_DB:
  - 'Greengenes2'
#  - 'SILVA138'
#  - 'NCBI'

##############################################
# Experimental Design Declaration
##############################################

DESIGN:
  # ------------------------------------------
  # Primary Experimental Factors
  # ------------------------------------------
  # Variables the experiment is designed to test.
  # Typical experiments take 'Group' as your grouping column, but more than one factor can be used.
  # Add a 'Order' column if you want to specify the order in which 'Group' appears. 
  # The 'Order' column can only contain integers (1,2,3...) and MUST match the 'Group' it is assigned to consistently.

  FACTORS:
    - column: "Group"
      type: "categorical"
      description: "Treatment mice received"

  # ------------------------------------------
  # Factor Interactions
  # ------------------------------------------
  # Only FACTORS listed above are allowed here.

  INTERACTIONS:
 
  # ------------------------------------------
  # Covariates / Confounders
  # ------------------------------------------
  # Variables adjusted for but not interpreted
  # as primary biological effects.
  # Only matters for ANCOMBC2

  COVARIATES: []
    # - column: "Batch"
    #   type: "categorical"
    #   description: "Sequencing batch"

##############################################
# Advanced Parameters  (defaults — rarely need changing)
# If some plots are failing due to cutoff value or not passing significance threshold, you can adjust these parameters to be more lenient.
##############################################

# --- Cutadapt ---
CUTADAPT_ERROR_RATE: 0.1          # primer-matching mismatch tolerance (cutadapt default)

# --- DADA2 ---
DADA2_TRIM_LEFT_F: 0              # 5' trim for forward reads (0 = primers already removed)
DADA2_TRIM_LEFT_R: 0              # 5' trim for reverse reads (0 = primers already removed)
TRUNC_LEN_Q_THRESHOLD: 20         # Phred Q-score floor for auto-selecting truncation length
TGS_DADA2_TRUNC_LEN: 0           # 0 = full-length CCS reads; no quality-based truncation needed

# --- Rarefaction depth ---
RAREFY_DEPTH_PERCENTILE: 0        # 0 = use sample minimum; e.g. 10 = 10th percentile

# --- Taxa barplots ---
TOP_N_TAXA: 20                    # taxa per barplot panel; >20 produces indistinguishable colours

# --- Functional prediction heatmaps ---
TOP_N_PICRUST: 30                  # Top N Pathways/KO/EG produced by PiCRUST2 shown in heatmaps

# --- LEfSe ---
# LEfSe runs as two implementations sharing the settings below: the original Python-style
# Huttenhower LEfSe and an R reimplementation via the microbiomeMarker package.
LEFSE_LDA_CUTOFF: 2.0            # log10 LDA score threshold (Segata et al. 2011 default is 2.0)
LEFSE_KW_CUTOFF: 0.05            # Kruskal-Wallis p-value threshold (α = 0.05)
LEFSE_WILCOXON_CUTOFF: 0.05      # Wilcoxon pairwise p-value threshold (α = 0.05)
LEFSE_NORM: "CPM"                # normalisation method (CPM ≈ relative-abundance for ratio stats)
LEFSE_RANDOM_SEED: 42            # fixes bootstrap subsampling for reproducibility

# --- ANCOMBC2 (under maintenance — currently unavailable) ---
ANCOMBC2_MIN_SAMPLE_PRESENCE: 2
ANCOMBC2_PRV_CUT: 0.05
ANCOMBC2_LIB_CUT: 1000
ANCOMBC2_P_ADJ_METHOD: "BH"
ANCOMBC2_ALPHA: 0.05
ANCOMBC2_PSEUDO_SENS: true
ANCOMBC2_STRUC_ZERO: false
ANCOMBC2_NEG_LB: false
ANCOMBC2_VOLCANO_SIG_THRESHOLD: 0.05
ANCOMBC2_HEATMAP_TOP_N: 30

# --- ALDEx2 (under maintenance — currently unavailable) ---
ALDEX2_P_ADJ_METHOD: "BH"
ALDEX2_PVALUE_CUTOFF: 0.05
ALDEX2_MC_SAMPLES: 512
ALDEX2_DENOM: "all"
ALDEX2_PAIRED_TEST: true
ALDEX2_HEATMAP_TOP_N: 30