# =============================================================================
# config_example.yaml
# Microbiome Analysis Workflow — Core Laboratory of Human Microbiome, TMU
# =============================================================================
# This file documents every configurable parameter in the pipeline.
# Copy this file, rename it to 'config_{YOUR_PROJECT_NAME}.yaml', and place it
# in the same directory as the Snakefile before launching the workflow.
#
# IMPORTANT: The filename (without .yaml) must exactly match STUDY_NAME below.
# =============================================================================


##############################################
# Project Information
##############################################

# STUDY_NAME
STUDY_NAME: 'template' 

##############################################
# Environment & Sequencing Parameters
##############################################

ENVIRONMENT_TYPE: "conda"

# ANALYSIS_MODE
ANALYSIS_MODE: 'standard'


# SEQUENCE_TYPE
SEQUENCE_TYPE: 'TGS'

# REGION
REGION: 'full_length'

# N_THREADS
N_THREADS: 10


##############################################
# Reference Database
##############################################

REFERENCE_DB:
  - 'Greengenes2'

##############################################
# Experimental Design Declaration
##############################################

DESIGN:

  FACTORS:        # Primary experimental variables; these are the main comparisons of interest.
    - column: "Timepoint"
      type: "categorical"
      description: "Sampling time relative to intervention (before / after)"

    - column: "Patient"
      type: "categorical"
      description: "Subject identifier for paired/repeated-measures design"

  INTERACTIONS:   # Whether to test for interactions between FACTORS; only relevant in ALDex2 and ANCOMBC2.
    - ["Timepoint", "Patient"]

  COVARIATES: []  # Whether to test for covariate effects; only relevant in ALDex2 and ANCOMBC2.


##############################################
# Advanced Parameters  (defaults — rarely need changing)
# If some plots are failing due to cutoff value or not passing significance threshold, you can adjust these parameters to be more lenient.
##############################################

# --- Cutadapt ---
CUTADAPT_ERROR_RATE: 0.1          # primer-matching mismatch tolerance (cutadapt default)

# --- DADA2 ---
DADA2_TRIM_LEFT_F: 0              # 5' trim for forward reads (0 = primers already removed)
DADA2_TRIM_LEFT_R: 0              # 5' trim for reverse reads (0 = primers already removed)
TRUNC_LEN_Q_THRESHOLD: 20         # Phred Q-score floor for auto-selecting truncation length
TGS_DADA2_TRUNC_LEN: 0           # 0 = full-length CCS reads; no quality-based truncation needed

# --- Rarefaction depth ---
RAREFY_DEPTH_PERCENTILE: 0        # 0 = use sample minimum; e.g. 10 = 10th percentile

# --- Taxa barplots ---
TOP_N_TAXA: 20                    # taxa per barplot panel; >20 produces indistinguishable colours

# --- Functional prediction heatmaps ---
TOP_N_PICRUST: 30                 # Top N Pathways/KO/EG produced by PiCRUST2 shown in heatmaps

# --- LEfSe ---
LEFSE_LDA_CUTOFF: 2.0            # log10 LDA score threshold (Segata et al. 2011 default is 2.0)
LEFSE_KW_CUTOFF: 0.05            # Kruskal-Wallis p-value threshold (α = 0.05)
LEFSE_WILCOXON_CUTOFF: 0.05      # Wilcoxon pairwise p-value threshold (α = 0.05)
LEFSE_NORM: "CPM"                # normalisation method (CPM ≈ relative-abundance for ratio stats)
LEFSE_RANDOM_SEED: 42            # fixes bootstrap subsampling for reproducibility

# --- ANCOMBC2 ---
ANCOMBC2_MIN_SAMPLE_PRESENCE: 2  # taxon must appear in ≥ N samples before prevalence cut
ANCOMBC2_PRV_CUT: 0.05           # prevalence cutoff (≥ 5% of samples required)
ANCOMBC2_LIB_CUT: 1000           # minimum library size; samples below this are excluded
ANCOMBC2_P_ADJ_METHOD: "BH"      # multiple-testing correction (Benjamini-Hochberg FDR)
ANCOMBC2_ALPHA: 0.05             # significance threshold after FDR correction
ANCOMBC2_PSEUDO_SENS: true       # flag results sensitive to pseudo-count choice
ANCOMBC2_STRUC_ZERO: false       # detect structural zeros (truly absent taxa)
ANCOMBC2_NEG_LB: false           # less-conservative structural-zero criterion

ANCOMBC2_VOLCANO_SIG_THRESHOLD: 0.05   # q-value cut for colouring volcano points
ANCOMBC2_HEATMAP_TOP_N: 30             # maximum features shown in heatmap

# --- ALDEx2 ---
ALDEX2_P_ADJ_METHOD: "BH"       # multiple-testing correction (Benjamini-Hochberg FDR)
ALDEX2_PVALUE_CUTOFF: 0.05      # adjusted p-value threshold for significance
ALDEX2_MC_SAMPLES: 512          # Monte Carlo CLR instances; increase (e.g. 512) for more stable p-values
ALDEX2_DENOM: "all"             # CLR denominator: "all" | "iqlr" (robust to outliers) | "zero" | "median"
ALDEX2_PAIRED_TEST: true        # paired Welch t-test for matched 2-group designs
ALDEX2_HEATMAP_TOP_N: 30        # maximum features shown in heatmap
