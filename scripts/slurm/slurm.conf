# Single-node SLURM cluster for this workstation.
# Installed to /etc/slurm/slurm.conf by setup_slurm.sh.
ClusterName=clhm-local
SlurmctldHost=tmu-clhm-NUC15CRHU5

AuthType=auth/munge
CredType=cred/munge
MpiDefault=none
ProctrackType=proctrack/cgroup
ReturnToService=1

# This host's CPU (Intel Core Ultra 5 225H) is a hybrid P-core/E-core chip.
# slurmd's own hardware auto-detection undercounts it (reports CPUs=4
# instead of the real 14 -- confirmed via `lscpu`/`/proc/cpuinfo`, a known
# Slurm/hwloc limitation on this CPU class), which otherwise drains the node
# at every startup with "Low socket*core*thread count, Low CPUs". This tells
# slurmd to trust the NodeName line below instead of its own detection.
SlurmdParameters=config_overrides

SlurmctldPidFile=/run/slurmctld.pid
SlurmdPidFile=/run/slurmd.pid
SlurmdSpoolDir=/var/spool/slurmd
SlurmUser=slurm
StateSaveLocation=/var/spool/slurmctld
SwitchType=switch/none
TaskPlugin=task/affinity,task/cgroup

# SCHEDULING
SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory

# LOGGING
SlurmctldDebug=info
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdDebug=info
SlurmdLogFile=/var/log/slurm/slurmd.log

# ACCOUNTING
# Required for `sacct`-based job status polling used by
# snakemake-executor-plugin-slurm — see scripts/slurm/setup_slurmdbd.sh.
AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=localhost
AccountingStoragePort=6819
JobAcctGatherType=jobacct_gather/cgroup

# COMPUTE NODES
# RealMemory is deliberately below total physical RAM (30886MB, per
# `slurmd -C`) to leave headroom for the OS and any interactive work outside
# SLURM. Topology (1 socket x 14 cores x 1 thread) is from `lscpu`, the
# authoritative source here since slurmd's own detection is wrong for this
# CPU (see SlurmdParameters=config_overrides above).
NodeName=tmu-clhm-NUC15CRHU5 CPUs=14 Sockets=1 CoresPerSocket=14 ThreadsPerCore=1 RealMemory=28000 State=UNKNOWN
PartitionName=main Nodes=tmu-clhm-NUC15CRHU5 Default=YES MaxTime=INFINITE State=UP
