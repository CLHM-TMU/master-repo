channels:
  - https://packages.qiime2.org/qiime2/2025.10/amplicon/released
  - conda-forge
  - bioconda
dependencies:
  - python=3.10
  - qiime2=2025.10
  - q2cli
  - q2-types
  - q2-feature-classifier
  - q2-metadata
  - q2-vsearch
  - numpy<2
  - matplotlib
  - cython
  - setuptools<82
  - pip
  - clang_osx-64       # Essential for building 'bp' and 'iow' on Mac
  - libcxx
  - libiconv
  - pip:
      - --no-binary=bp,iow
      - q2-greengenes2
      - iow
      - bp
      - redbiom