<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>

  <!-- If the Stats interface was enabled at compile-time, only root may use it.
       Replace USERNAME and copy this file in /home/patwuch/Documents/projects/Core-Lab-of-Human-Microbiome-TMU/main/.snakemake/conda/d22e8a215351360d6473765ea86f8ed9_/etc/dbus-1/system.d/
       if you want to enable other privileged users to view statistics and
       debug info -->

  <policy user="USERNAME">
    <allow send_destination="org.freedesktop.DBus"
           send_interface="org.freedesktop.DBus.Debug.Stats"/>
  </policy>

</busconfig>
