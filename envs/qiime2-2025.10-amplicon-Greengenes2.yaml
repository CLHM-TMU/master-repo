channels:
  - https://packages.qiime2.org/qiime2/2025.10/amplicon/released
  - conda-forge
  - bioconda
platforms:
  - linux-64
dependencies:
  - python=3.10
  - qiime2=2025.10
  - q2cli
  - q2-types
  - q2-feature-classifier
  - q2-metadata
  - q2-vsearch
  - numpy<2
  - matplotlib
  - cython
  - setuptools<82
  - pip
  - compilers       # provides gcc/g++ needed to build 'bp' and 'iow' from source on Linux
  - make            # 'iow' invokes make directly during its build
  - libiconv
  - pip:
      # q2-greengenes2's setup.py declares 'iow' (not 'bp') as its dependency.
      # 'iow' installs the real balanced-parentheses library under the
      # top-level import name 'bp'. The PyPI package literally named 'bp' is
      # an unrelated "Binpack implementation" project that happens to squat
      # the same import name — it must NOT be installed, or it silently
      # clobbers the real 'bp' module files.
      - --no-binary=iow
      - q2-greengenes2
      - iow
      - redbiom