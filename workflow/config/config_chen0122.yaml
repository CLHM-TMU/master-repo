##############################################
# Project Information
##############################################

STUDY_NAME: 'chen0122'

##############################################
# Environment & Sequencing Parameters
##############################################

ENVIRONMENT_TYPE: "conda"
ANALYSIS_MODE: 'standard'
SEQUENCE_TYPE: 'NGS'
REGION: 'region_V3V4'
N_THREADS: 10

##############################################
# Reference Database
##############################################

REFERENCE_DB:
  - 'Greengenes2'

##############################################
# Experimental Design Declaration
##############################################

DESIGN:
  COMPOSITE_LABELS:
    - column: "Group"
      derived_from:
        - "DietPhase1"
        - "DietPhase2"
        - "Exercise"
      allowed_uses:
        - "visualization"
        - "pairwise_contrasts"
      description: "Composite treatment group"

  FACTORS:
    - column: "Exercise"
      type: "categorical"
      description: "Exercise intervention"

    - column: "DietPhase2" # FIXED: Added missing closing quote
      type: "categorical"
      description: "Second phase of dietary intervention"

    - column: "DietPhase1"
      type: "categorical"
      description: "First phase of dietary intervention"

  INTERACTIONS:
    - ["Exercise", "DietPhase1", "DietPhase2"]

  COVARIATES: []

##############################################
# Sample Filtering
##############################################

IGNORE_SAMPLES: []

##############################################
# Functional Prediction
##############################################

RUN_PICRUST2: "true"