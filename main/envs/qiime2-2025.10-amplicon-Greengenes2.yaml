channels:
  - https://packages.qiime2.org/qiime2/2024.10/amplicon/released
  - conda-forge
  - bioconda
dependencies:
  - python=3.10
  - qiime2-amplicon=2024.10
  - q2cli
  - numpy
  - cython
  - setuptools
  - scikit-bio=0.6.0
  - pip
  - clang_osx-64       # Essential for building 'bp' and 'iow' on Mac
  - libcxx
  - libiconv
  - pip:
      - q2-greengenes2
      - iow
      - bp
      - redbiom