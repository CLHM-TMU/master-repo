# Installed to /etc/slurm/cgroup.conf by setup_slurm.sh.
# Lets SLURM itself enforce the --mem a job requests via cgroup v2, so a job
# that requests less than the node's full RealMemory can't exceed it.
CgroupPlugin=cgroup/v2
# Left off (not "yes"): to build each job's cpuset, this requires SLURM's
# own hwloc-based CPU topology detection, which is wrong for this host's
# hybrid P-core/E-core CPU (Intel Core Ultra 5 225H) -- the same class of
# bug worked around at the node level via SlurmdParameters=config_overrides
# in slurm.conf, but that override doesn't reach this cpuset-construction
# code path. Confirmed in practice: a job granted cpu=12 by the scheduler
# had its actual process affinity silently pinned to just 4 CPUs
# ("Provided cores: 4" in its Snakemake log), which contributed to a
# TGS_dada2 run overrunning its time limit and getting killed with no
# output. Without CPU cpuset constraining, jobs keep the full 14-CPU
# affinity mask and just share cores via normal OS scheduling if
# oversubscribed -- worse isolation, but correct core counts.
ConstrainRAMSpace=yes
ConstrainSwapSpace=yes
